name: Financial Ponds Daily

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      as_of:
        description: "Business date (YYYY-MM-DD); blank uses Hong Kong today"
        required: false
        type: string
      mode:
        description: "Explicit collection mode"
        required: true
        default: live
        type: choice
        options: [live, historical, offline]
  schedule:
    - cron: "45 8 * * 1-5"

env:
  TZ: Asia/Hong_Kong

jobs:
  pr_offline_validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FP_OFFLINE_PR_CHECK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record committed publication hashes
        run: |
          git diff --exit-code -- financial-pond/data financial-pond/history/market-inputs
          git ls-files -s financial-pond/data financial-pond/history/market-inputs > "$RUNNER_TEMP/fp-published-before.txt"
      - name: Run offline pull-request contracts
        run: |
          npm run build
          npm test
          npm run validate
          npm run validate:data
          npm run validate:history-quality
          npm run fp:replay -- --as-of 2026-07-28
      - name: Prove published inputs and outputs were not mutated
        run: |
          git diff --exit-code -- financial-pond/data financial-pond/history/market-inputs
          git ls-files -s financial-pond/data financial-pond/history/market-inputs > "$RUNNER_TEMP/fp-published-after.txt"
          diff "$RUNNER_TEMP/fp-published-before.txt" "$RUNNER_TEMP/fp-published-after.txt"

  collect:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      as_of: ${{ steps.context.outputs.as_of }}
      mode: ${{ steps.context.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: npm ci
      - name: Install provider dependencies
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'offline' }}
        run: python -m pip install -r tools/financial-pond-framework/providers/requirements.txt
      - name: Resolve explicit run context
        id: context
        run: |
          AS_OF="${{ inputs.as_of }}"
          if [[ -z "$AS_OF" ]]; then AS_OF="$(TZ=Asia/Hong_Kong date +%F)"; fi
          MODE="${{ inputs.mode }}"
          if [[ -z "$MODE" ]]; then MODE="live"; fi
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Collect once
        run: npm run fp:collect -- --mode "$MODE" --as-of "$AS_OF"
      - uses: actions/upload-artifact@v4
        with:
          name: fp-inputs
          path: financial-pond/history/market-inputs/${{ env.AS_OF }}
          if-no-files-found: error

  model:
    if: ${{ github.event_name != 'pull_request' }}
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: fp-inputs
          path: financial-pond/history/market-inputs/${{ needs.collect.outputs.as_of }}
      - name: Resolve date
        run: |
          AS_OF="${{ needs.collect.outputs.as_of }}"
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
      - name: Deterministic model once
        run: |
          npm run fp:normalize -- --as-of "$AS_OF"
          npm run fp:observe -- --as-of "$AS_OF"
          npm run fp:assess -- --as-of "$AS_OF"
          npm run fp:penetrate -- --as-of "$AS_OF"
          npm run fp:decide -- --as-of "$AS_OF"
          npm run fp:review -- --as-of "$AS_OF"
      - uses: actions/upload-artifact@v4
        with:
          name: fp-model
          path: .fp-work/${{ env.AS_OF }}
          include-hidden-files: true
          if-no-files-found: error

  validate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [collect, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Resolve date
        run: |
          AS_OF="${{ needs.collect.outputs.as_of }}"
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: fp-inputs
          path: financial-pond/history/market-inputs/${{ env.AS_OF }}
      - uses: actions/download-artifact@v4
        with:
          name: fp-model
          path: .fp-work/${{ env.AS_OF }}
      - name: Validate before persistence
        run: npm run fp:validate -- --as-of "$AS_OF"
      - name: Test hard model and frontend contracts
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: fp-validated
          path: .fp-work/${{ env.AS_OF }}
          include-hidden-files: true
          if-no-files-found: error

  persist:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [collect, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Resolve date
        run: |
          AS_OF="${{ needs.collect.outputs.as_of }}"
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: fp-inputs
          path: financial-pond/history/market-inputs/${{ env.AS_OF }}
      - uses: actions/download-artifact@v4
        with:
          name: fp-validated
          path: .fp-work/${{ env.AS_OF }}
      - name: Persist and publish validated artifacts
        run: |
          npm run fp:persist -- --as-of "$AS_OF"
          npm run fp:publish -- --as-of "$AS_OF"
          npm run validate:data
          npm run build
          npm run validate
      - name: Commit explicit generated-data whitelist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add financial-pond/data/daily_manifest.json
          git add financial-pond/data/sector_assessment_daily.json
          git add financial-pond/data/entry_decision_daily.json
          git add financial-pond/data/market_penetration_brief.json
          git add financial-pond/data/review_analytics.json
          git add "financial-pond/data/history/assessments/${AS_OF}.json"
          git add "financial-pond/data/history/decisions/${AS_OF}.json"
          git add "financial-pond/data/history/penetration/${AS_OF}.json"
          git add "financial-pond/data/history/reviews/${AS_OF}.json"
          git add "financial-pond/data/history/manifests/${AS_OF}.json"
          git add "financial-pond/history/market-inputs/${AS_OF}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update financial ponds official daily artifacts"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fp-published
          path: |
            financial-pond/data
            financial-pond/history/market-inputs/${{ env.AS_OF }}

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: persist
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: fp-published
          path: financial-pond
      - name: Deploy already validated publication
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy
